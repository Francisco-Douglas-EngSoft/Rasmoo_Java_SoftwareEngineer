<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em HTML</title>
</head>
<body>
    <h1>Tabelas em HTML</h1>
    <p>As tabelas organizam dados em linhas e colunas. Use cabeçalhos para identificar
        o conteúdo de cada coluna e linha.</p>

    <table>
        <caption>Notas dos alunos</caption>
        <thead>
            <tr>
                <th scope="col">Aluno</th>
                <th scope="col">Matéria</th>
                <th scope="col">Nota</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Ana</th>
                <td>HTML</td>
                <td>9,5</td>
            </tr>
            <tr>
                <th scope="row">Bruno</th>
                <td>CSS</td>
                <td>8,0</td>
            </tr>
            <tr>
                <th scope="row">Carla</th>
                <td>HTML</td>
                <td>10,0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row" colspan="2">Média da turma</th>
                <td>9,2</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
