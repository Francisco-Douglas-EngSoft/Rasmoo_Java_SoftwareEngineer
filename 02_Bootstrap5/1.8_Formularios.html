<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários com Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <main class="container py-5">
        <header class="mb-5">
            <p class="text-primary fw-bold text-uppercase small mb-2">Bootstrap 5</p>
            <h1 class="display-5 fw-bold">Formulários</h1>
            <p class="lead text-muted mb-0">Exemplos básicos de campos para coletar informações.</p>
        </header>

        <div class="row g-5">
            <section class="col-lg-7" aria-labelledby="formulario-contato">
                <h2 id="formulario-contato" class="h4 mb-3">Formulário de contato</h2>
                <form>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" placeholder="Seu nome">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" aria-describedby="email-ajuda" placeholder="nome@exemplo.com">
                        <div id="email-ajuda" class="form-text">Não compartilharemos seu e-mail com outras pessoas.</div>
                    </div>

                    <div class="mb-3">
                        <label for="assunto" class="form-label">Assunto</label>
                        <select class="form-select" id="assunto">
                            <option selected>Escolha uma opção</option>
                            <option value="duvida">Dúvida</option>
                            <option value="sugestao">Sugestão</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="mensagem" class="form-label">Mensagem</label>
                        <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva sua mensagem"></textarea>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="receber-novidades">
                        <label class="form-check-label" for="receber-novidades">
                            Quero receber novidades por e-mail
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Enviar mensagem</button>
                </form>
            </section>

            <section class="col-lg-5" aria-labelledby="outros-controles">
                <h2 id="outros-controles" class="h4 mb-3">Outros controles</h2>

                <div class="mb-4">
                    <label for="arquivo" class="form-label">Enviar um arquivo</label>
                    <input class="form-control" type="file" id="arquivo">
                </div>

                <fieldset class="mb-4">
                    <legend class="fs-6">Preferência de contato</legend>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="contato" id="contato-email" checked>
                        <label class="form-check-label" for="contato-email">E-mail</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="contato" id="contato-telefone">
                        <label class="form-check-label" for="contato-telefone">Telefone</label>
                    </div>
                </fieldset>

                <div class="mb-4">
                    <label for="satisfacao" class="form-label">Nível de satisfação</label>
                    <input type="range" class="form-range" min="0" max="5" id="satisfacao">
                </div>

                <div class="mb-3">
                    <label for="campo-invalido" class="form-label">Exemplo de campo inválido</label>
                    <input type="text" class="form-control is-invalid" id="campo-invalido" aria-describedby="erro-campo" value="">
                    <div id="erro-campo" class="invalid-feedback">Este campo precisa ser preenchido.</div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
