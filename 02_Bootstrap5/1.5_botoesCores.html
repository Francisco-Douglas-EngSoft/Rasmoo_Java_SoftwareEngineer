<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botões com Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <main class="container py-5">
        <header class="mb-5">
            <p class="text-primary fw-bold text-uppercase small mb-2">Bootstrap 5</p>
            <h1 class="display-5 fw-bold">Botões</h1>
            <p class="lead text-muted mb-0">Exemplos simples para ações e navegação em uma interface.</p>
        </header>

        <section class="mb-5" aria-labelledby="variantes">
            <h2 id="variantes" class="h4 mb-3">Cores e variantes</h2>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-primary">Principal</button>
                <button type="button" class="btn btn-secondary">Secundário</button>
                <button type="button" class="btn btn-success">Confirmar</button>
                <button type="button" class="btn btn-danger">Excluir</button>
                <button type="button" class="btn btn-warning">Atenção</button>
                <button type="button" class="btn btn-dark">Escuro</button>
            </div>
        </section>

        <section class="mb-5" aria-labelledby="contorno">
            <h2 id="contorno" class="h4 mb-3">Botões com contorno</h2>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-primary">Saiba mais</button>
                <button type="button" class="btn btn-outline-success">Salvar</button>
                <button type="button" class="btn btn-outline-danger">Cancelar</button>
            </div>
        </section>

        <section class="mb-5" aria-labelledby="tamanhos">
            <h2 id="tamanhos" class="h4 mb-3">Tamanhos</h2>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <button type="button" class="btn btn-primary btn-lg">Botão grande</button>
                <button type="button" class="btn btn-primary">Tamanho padrão</button>
                <button type="button" class="btn btn-primary btn-sm">Botão pequeno</button>
            </div>
        </section>

        <section class="mb-5" aria-labelledby="estados">
            <h2 id="estados" class="h4 mb-3">Estados e navegação</h2>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <button type="button" class="btn btn-primary">Continuar</button>
                <button type="button" class="btn btn-primary" disabled>Indisponível</button>
                <a class="btn btn-outline-secondary" href="#variantes" role="button">Voltar às variantes</a>
            </div>
        </section>

        <section aria-labelledby="grupo">
            <h2 id="grupo" class="h4 mb-3">Grupo de botões</h2>
            <div class="btn-group" role="group" aria-label="Opções de visualização">
                <button type="button" class="btn btn-outline-primary">Lista</button>
                <button type="button" class="btn btn-outline-primary">Grade</button>
                <button type="button" class="btn btn-outline-primary">Mapa</button>
            </div>
        </section>
    </main>
</body>
</html>
